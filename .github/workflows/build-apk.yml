name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'youtube-clone/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK Command-line Tools
        run: |
          # Create Android SDK directory
          mkdir -p /usr/local/android-sdk/cmdline-tools/latest
          
          # Download the latest cmdline-tools (version 12.0)
          wget -q -O /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-12.0_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /usr/local/android-sdk/cmdline-tools/latest
          
          # Set environment variables
          echo "ANDROID_HOME=/usr/local/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:/usr/local/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept all SDK licenses
        run: |
          yes | sdkmanager --sdk_root=/usr/local/android-sdk --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root=/usr/local/android-sdk "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          sdkmanager --sdk_root=/usr/local/android-sdk --list

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('youtube-clone/**/*.gradle*') }}

      - name: Build APK
        run: |
          cd youtube-clone
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/android-sdk
          ANDROID_SDK_ROOT: /usr/local/android-sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: youtube-clone-debug-apk
          path: youtube-clone/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Show APK info
        if: success()
        run: |
          cd youtube-clone
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK Size: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
            echo "APK Path: app/build/outputs/apk/debug/app-debug.apk"
          fi
