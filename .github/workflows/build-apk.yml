name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-version: '34'
          ndk-version: '26.2.11394342'
          cmake-version: '3.22.1'
          build-tools-version: '34.0.0'
          accept-licenses: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            youtube-clone/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android SDK
        uses: actions/cache@v3
        with:
          path: |
            /usr/local/android-sdk
            /opt/hostedtoolcache/Android_SDK
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('.github/workflows/build-apk.yml') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Build APK
        run: |
          cd youtube-clone
          chmod +x gradlew
          
          # Accept all SDK licenses
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          
          # Build debug APK
          ./gradlew clean assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/android-sdk
          ANDROID_SDK_ROOT: /usr/local/android-sdk

      - name: Rename APK
        run: |
          cd youtube-clone
          mkdir -p apk-output
          cp app/build/outputs/apk/debug/app-debug.apk apk-output/youtube-clone-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-clone-debug-apk
          path: youtube-clone/apk-output/youtube-clone-debug.apk
          retention-days: 30
          compression-level: 9

      - name: Get APK Info
        run: |
          cd youtube-clone
          if [ -f apk-output/youtube-clone-debug.apk ]; then
            echo "APK Size: $(du -h apk-output/youtube-clone-debug.apk | cut -f1)"
            echo "APK Path: apk-output/youtube-clone-debug.apk"
          fi

      - name: Display Build Success
        if: success()
        run: |
          echo "✅ APK Build Successful!"
          echo "📁 APK available in Artifacts"
          echo "🔗 Download from: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
