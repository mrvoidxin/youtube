name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'youtube-clone/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '10.0'

      - name: Install Android packages and accept licenses
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses || true
          sdkmanager --list

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('youtube-clone/**/*.gradle*') }}

      - name: Build APK
        run: |
          cd youtube-clone
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/android-sdk
          ANDROID_SDK_ROOT: /usr/local/android-sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: youtube-clone-debug-apk
          path: youtube-clone/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
