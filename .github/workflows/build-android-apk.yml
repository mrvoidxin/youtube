name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'youtube-clone/**'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Step 3: Setup Android SDK using cmdline-tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '10.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      # Step 4: Install required Android packages
      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "emulator" "patcher;v4"
          sdkmanager --list
        env:
          ANDROID_HOME: /usr/local/android-sdk

      # Step 5: Accept all SDK licenses (fallback)
      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # Step 6: Cache Gradle dependencies
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            youtube-clone/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('youtube-clone/**/*.gradle*', 'youtube-clone/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 7: Make gradlew executable
      - name: Make gradlew executable
        run: |
          cd youtube-clone
          chmod +x gradlew

      # Step 8: Build Debug APK
      - name: Build Debug APK
        run: |
          cd youtube-clone
          ./gradlew clean assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/android-sdk
          ANDROID_SDK_ROOT: /usr/local/android-sdk
          ORG_GRADLE_PROJECT_android_suppressUnsupportedCompileSdk: '34'

      # Step 9: Verify APK exists
      - name: Verify APK
        id: verify_apk
        run: |
          cd youtube-clone
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK found!"
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
            echo "APK Size: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
          else
            echo "ERROR: APK not found!"
            ls -la app/build/outputs/apk/debug/ || true
            exit 1
          fi

      # Step 10: Upload APK as artifact
      - name: Upload APK
        if: success() && steps.verify_apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: youtube-clone-debug-apk
          path: youtube-clone/${{ steps.verify_apk.outputs.apk_path }}
          retention-days: 30
          compression-level: 9

      # Step 11: Show success message
      - name: Build Success
        if: success()
        run: |
          echo "=========================================="
          echo "✅ APK Build Successful!"
          echo "=========================================="
          echo "📦 APK: youtube-clone-debug.apk"
          echo "🔗 Download from GitHub Actions Artifacts"
          echo "📊 Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "=========================================="
